---

# A list of file extensions that Nanoc will consider to be textual rather than
# binary. If an item with an extension not in this list is found,  the file
# will be considered as binary.
text_extensions: ['html', 'md', 'inc', 'conf']

prune:
  auto_prune: true

data_sources:
  - type: filesystem
    encoding: utf-8
  - type: questions
    items_root: '/questions'
    # Special configuration for development and testing
    xtest:
      # Limit the number of questions from each site
      max_per_site: 10
      # Limit the selected questions to answered ones only (easier to test
      # answer rendering)
      only_answered: true
      # Limit the selected questions to migrated ones only (easier to test
      # migration config rendering)
      only_migrated: true
