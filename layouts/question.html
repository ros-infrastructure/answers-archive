
<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title><%= page_title_for @item %></title>
    <link rel="stylesheet" href="/stylesheet.css">

    <!-- you don't need to keep this, but it's cool for stats! -->
    <meta name="generator" content="Nanoc <%= Nanoc::VERSION %>">
  </head>
  <body>
    <%= render '/header.*' %>
    <div id="main">
      <div class="question">
        <%= yield %>
      </div>
      <%
        answers = answers_for @item
        if !answers.empty?
      %>
      <section class="answers">
        <% answers.sort_by{|answer| answer[:creation_date]}.each do |answer| %>  
        <%= answer.reps.find{|r| r.name == :default}.compiled_content %> 
        <% end %>
      </section>
      <% end %>
    </div>
  </body>
</html>
