<!DOCTYPE html>
<html>
  <%= render '/html_head.html' %>
  <body>
    <%= render '/site_header.*' %>
    <div id="main">
      <%= yield %>

      <ul>
        <% questions_for_site(item[:site_id]).each do |question| %>
        <li><a href="question/<%= question[:original_post_id] %>"><%= question[:title] %></a></li>
        <% end %>
      </ul>
    </div>
  </body>
</html>
