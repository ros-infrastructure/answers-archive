<div class="answer<% if item[:accepted?] %> accepted<% end %>">
  <%= yield %>
  <% if item[:accepted?] %>
  <div class="accepted">
    <span class="accepted">☑️</span> This answer was <strong>ACCEPTED</strong> on the original site.
  </div>
  <% end %>
  <div class="owner">
    <p>Answer by <%= item[:owner].display_name %> on <%= pretty_date item[:creation_date] %></p>
  </div>
</div>
